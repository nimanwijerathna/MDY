<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>MDY | Journeys - Create Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <link rel="icon" type="image/x-icon"
        href="https://mahameghadharmayathra.lk/wp-content/uploads/2023/05/MahameghaDharmayathraLogo.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00b050",
                        secondary: "#1e3a8a",
                        "background-light": "#f3f4f6",
                        "background-dark": "#0f172a",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                        "sidebar-dark": "#111827",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-sans text-gray-800 dark:text-gray-200 antialiased transition-colors duration-200">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 hidden md:flex flex-col bg-sidebar-dark text-white border-r border-gray-700">
            <div class="h-16 flex items-center px-6 border-b border-gray-700 bg-gray-900">
                <span class="text-lg font-bold tracking-wide">MDY - DASHBOARD</span>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-2 overflow-y-auto">
                <a class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                    href="#">
                    <span class="material-icons-round mr-3">dashboard</span>
                    Dashboard
                </a>
                <a class="flex items-center justify-between px-4 py-3 text-sm font-medium rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                    href="viewusers.html">
                    <div class="flex items-center">
                        <span class="material-icons-round mr-3">people</span>
                        Users
                    </div>
                    <span class="material-icons-round text-xs">chevron_right</span>
                </a>
                <a class="flex items-center justify-between px-4 py-3 text-sm font-medium rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                    href="allfollowers.html">
                    <div class="flex items-center">
                        <span class="material-icons-round mr-3">groups</span>
                        Followers
                    </div>
                    <span class="material-icons-round text-xs">chevron_right</span>
                </a>
                <a class="flex items-center justify-between px-4 py-3 text-sm font-medium rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                    href="submittedList.html">
                    <div class="flex items-center">
                        <span class="material-icons-round mr-3">menu_book</span>
                        Passports
                    </div>
                    <span class="material-icons-round text-xs">chevron_right</span>
                </a>
                <a class="flex items-center justify-between px-4 py-3 text-sm font-medium rounded-lg text-white bg-gray-800 transition-colors"
                    href="#">
                    <div class="flex items-center">
                        <span class="material-icons-round mr-3">groups</span>
                        Journeys
                    </div>
                    <span class="material-icons-round text-xs">expand_more</span>
                </a>
                <div class="pl-12 space-y-1">
                    <a class="flex items-center px-3 py-2 text-sm font-medium rounded-lg text-white font-medium bg-primary"
                        href="projects.html">
                        <span class="w-4 h-4 rounded-full overflow-hidden mr-3 shrink-0 border border-gray-700">
                            <img src="https://flagpedia.net/data/flags/h80/in.png" class="w-full h-full object-cover"
                                alt="India">
                        </span>
                        Dambadiwa
                    </a>                    
                    <a class="flex items-center px-3 py-2 text-sm font-medium text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors"
                        href="projects_lakdiwa.html">
                        <span class="w-4 h-4 rounded-full overflow-hidden mr-3 shrink-0 border border-gray-700">
                            <img src="https://flagpedia.net/data/flags/h80/lk.png" class="w-full h-full object-cover"
                                alt="Sri Lanka">
                        </span>
                        Lakdiwa
                    </a>
                </div>
                <a class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                    href="visa.html">
                    <span class="material-icons-round mr-3">assignment_ind</span>
                    Visa
                </a>
                <a class="flex items-center justify-between px-4 py-3 text-sm font-medium rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
                    href="finance.html">
                    <div class="flex items-center">
                        <span class="material-icons-round mr-3">payments</span>
                        Finance
                    </div>
                    <span class="material-icons-round text-xs">chevron_right</span>
                </a>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded bg-gray-600 flex items-center justify-center text-xs font-bold">N</div>
                    <div class="ml-3">
                        <p class="text-sm font-medium">Niman</p>
                    </div>
                    <button class="ml-auto text-gray-400 hover:text-white">
                        <span class="material-icons-round">unfold_more</span>
                    </button>
                </div>
            </div>
        </aside>
        <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            <header class="bg-primary shadow-md z-10">
                <div class="px-6 py-4 flex items-center justify-between">
                    <button class="md:hidden text-white mr-4">
                        <span class="material-icons-round">menu</span>
                    </button>
                    <h1 class="text-2xl font-semibold text-white text-center w-full md:w-auto mx-auto md:mx-0">Create
                        Project</h1>
                    <button class="p-2 rounded-full hover:bg-white/20 text-white transition-colors absolute right-4"
                        onclick="document.documentElement.classList.toggle('dark')">
                        <span class="material-icons-round block dark:hidden">dark_mode</span>
                        <span class="material-icons-round hidden dark:block">light_mode</span>
                    </button>
                </div>
            </header>
            <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 bg-gray-50 dark:bg-background-dark">
                <nav class="flex items-center text-sm text-gray-500 dark:text-gray-400 mb-6">
                    <a class="hover:text-primary transition-colors flex items-center" href="#">
                        <span class="material-icons-round text-base mr-1">home</span>
                    </a>
                    <span class="mx-2">/</span>
                    <a class="hover:text-primary transition-colors" href="projects.html">Journeys - Dambadiwa</a>
                    <span class="mx-2">/</span>
                    <span class="font-medium text-primary">Create Project</span>
                </nav>
                <div class="max-w-4xl mx-auto">
                    <div
                        class="bg-white dark:bg-surface-dark rounded-xl shadow-lg border border-gray-100 dark:border-gray-700 overflow-hidden">
                        <form class="p-6 md:p-8 space-y-6">
                            <div class="space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                                            for="project-name">Project Name</label>
                                        <input
                                            class="w-full rounded-lg border-gray-300 bg-gray-50 focus:border-primary focus:ring-primary dark:bg-gray-800 dark:border-gray-600 dark:text-white dark:focus:border-primary sm:text-sm h-11"
                                            id="project-name" name="project-name" placeholder="Enter project name"
                                            type="text" />
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                                            for="estimated-count">Select Quarter</label>
                                        <select
                                            class="w-full rounded-lg border-gray-300 bg-gray-50 focus:border-primary focus:ring-primary dark:bg-gray-800 dark:border-gray-600 dark:text-white dark:focus:border-primary sm:text-sm h-11"
                                            id="estimated-count" name="estimated-count">
                                            <option value="">Select Quarter</option>
                                            <option>Quarter 01</option>
                                            <option>Quarter 02</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                                            for="project-fee">Project Fee For Individual (Rs)</label>
                                        <input
                                            class="w-full rounded-lg border-gray-300 bg-gray-50 focus:border-primary focus:ring-primary dark:bg-gray-800 dark:border-gray-600 dark:text-white dark:focus:border-primary sm:text-sm h-11"
                                            id="project-fee" name="project-fee" placeholder="Enter fee amount"
                                            type="number" />
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                                            for="estimated-count">Estimated Count</label>
                                        <input
                                            class="w-full rounded-lg border-gray-300 bg-gray-50 focus:border-primary focus:ring-primary dark:bg-gray-800 dark:border-gray-600 dark:text-white dark:focus:border-primary sm:text-sm h-11"
                                            id="estimated-count" name="estimated-count"
                                            placeholder="Enter estimated count" type="number" />
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                                            for="start-date">Start Date</label>
                                        <div class="relative">
                                            <input
                                                class="w-full rounded-lg border-gray-300 bg-gray-50 focus:border-primary focus:ring-primary dark:bg-gray-800 dark:border-gray-600 dark:text-white dark:focus:border-primary sm:text-sm h-11"
                                                id="start-date" name="start-date" type="date" />
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                                            for="end-date">End Date</label>
                                        <div class="relative">
                                            <input
                                                class="w-full rounded-lg border-gray-300 bg-gray-50 focus:border-primary focus:ring-primary dark:bg-gray-800 dark:border-gray-600 dark:text-white dark:focus:border-primary sm:text-sm h-11"
                                                id="end-date" name="end-date" type="date" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="pt-2">
                                <button
                                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg shadow-sm hover:shadow transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900 w-full md:w-auto"
                                    type="button">
                                    Create
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
