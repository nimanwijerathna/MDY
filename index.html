<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>MDY Sign-In Page</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1f2937", // Dark grey/black from button in reference
                        "primary-hover": "#111827",
                        "background-light": "#ffffff",
                        "background-dark": "#111827",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1f2937",
                        "input-bg-light": "#f3f4f6", // Light grey input background
                        "input-bg-dark": "#374151",
                        "border-light": "#e5e7eb",
                        "border-dark": "#374151",
                        "text-main-light": "#111827",
                        "text-main-dark": "#f9fafb",
                        "text-muted-light": "#6b7280",
                        "text-muted-dark": "#9ca3af",
                        "link-blue": "#3b82f6",
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        'xl': "0.75rem",
                        '2xl': "1rem",
                    },
                },
            },
        };
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-sans h-screen w-full overflow-hidden flex transition-colors duration-300">
    <div class="hidden lg:block lg:w-1/2 relative h-full">
        <div class="absolute inset-0 bg-black/10 dark:bg-black/40 z-10 pointer-events-none"></div>
        <div class="absolute inset-0 w-full h-full overflow-hidden">
            <a href="#" title="Budu Pasebudu Arahanthaka Maha Viharaya">
                <img src="https://live.staticflickr.com/65535/54451385426_103363d9a6_b.jpg"
                    class="w-full h-full object-cover"
                    alt="Budu Pasebudu Arahanthaka Maha Viharaya - Pasebudu Mandiraya">
            </a>
            <script async src="//embedr.flickr.com/assets/client-code.js" charset="utf-8"></script>
        </div>
    </div>
    <div
        class="w-full lg:w-1/2 h-full flex items-center justify-center p-4 sm:p-8 lg:p-12 relative bg-background-light dark:bg-background-dark">
        <button aria-label="Toggle Dark Mode"
            class="absolute top-6 right-6 p-2 rounded-full text-text-muted-light dark:text-text-muted-dark hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors focus:outline-none"
            onclick="document.documentElement.classList.toggle('dark')">
            <span class="material-icons text-xl">brightness_medium</span>
        </button>
        <div
            class="w-full max-w-md bg-surface-light dark:bg-surface-dark rounded-xl shadow-none lg:shadow-xl lg:border border-border-light dark:border-border-dark p-8 transition-all duration-300">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-semibold text-text-main-light dark:text-text-main-dark mb-2">
                    Welcome to Mahamevnawa Monastery
                </h1>
                <p class="text-sm text-text-muted-light dark:text-text-muted-dark">
                    Please sign in to access your dashboard
                </p>
            </div>
            <form action="#" class="space-y-6" method="POST">
                <div>
                    <label class="block text-sm font-medium text-text-main-light dark:text-text-main-dark mb-1.5"
                        for="email">
                        Email address
                    </label>
                    <div class="relative">
                        <input
                            class="block w-full px-4 py-3 rounded-lg border-transparent bg-input-bg-light dark:bg-input-bg-dark text-text-main-light dark:text-text-main-dark placeholder-text-muted-light dark:placeholder-text-muted-dark focus:border-primary focus:bg-white dark:focus:bg-gray-800 focus:ring-2 focus:ring-primary/20 transition-all duration-200 sm:text-sm"
                            id="email" name="email" placeholder="you@example.com" required="" type="email"
                            value="nimanwijerathna@gmail.com" />
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-main-light dark:text-text-main-dark mb-1.5"
                        for="password">
                        Password
                    </label>
                    <div class="relative">
                        <input
                            class="block w-full px-4 py-3 rounded-lg border-transparent bg-input-bg-light dark:bg-input-bg-dark text-text-main-light dark:text-text-main-dark placeholder-text-muted-light dark:placeholder-text-muted-dark focus:border-primary focus:bg-white dark:focus:bg-gray-800 focus:ring-2 focus:ring-primary/20 transition-all duration-200 sm:text-sm pr-10"
                            id="password" name="password" placeholder="••••••••" required="" type="password"
                            value="......" />
                        <button
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-text-muted-light dark:text-text-muted-dark hover:text-text-main-light dark:hover:text-text-main-dark transition-colors cursor-pointer focus:outline-none"
                            type="button">
                            <span class="material-icons text-lg">visibility_off</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input
                            class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600"
                            id="remember-me" name="remember-me" type="checkbox" />
                        <label class="ml-2 block text-sm text-text-main-light dark:text-text-main-dark"
                            for="remember-me">
                            Remember me
                        </label>
                    </div>
                </div>
                <div>
                    <a href="allfollowers.html"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark transition-all duration-200 transform hover:-translate-y-0.5 no-underline">
                        Log in
                    </a>
                </div>
            </form>
            <div class="mt-6 text-center">
                <p class="text-sm text-text-muted-light dark:text-text-muted-dark">
                    Make Payment Here
                    <a class="font-medium text-link-blue hover:text-blue-600 dark:hover:text-blue-400 underline decoration-1 underline-offset-2 transition-colors"
                        href="payments.html">
                        Payment
                    </a>
                </p>
            </div>
        </div>
    </div>

</body>

</html>
